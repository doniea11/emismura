<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seksi Pendidikan Madrasah - Kemenag Musi Rawas</title>
  
  <!-- Font Elegan: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- SheetJS untuk Export Excel (.xlsx) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg-body: #F0FDF4;
      --bg-container: #FFFFFF;
      --text-main: #000000;
      --text-muted: #4A5568;
      --primary: #10B981;
      --primary-hover: #059669;
      --primary-light: rgba(16, 185, 129, 0.12);
      --border-color: #D1FAE5;
      --marquee-bg: #D1FAE5;
      --marquee-text: #065F46;
      --sidebar-bg: #FFFFFF;
      --shadow-sm: 0 4px 15px rgba(0,0,0,0.03);
      --shadow-md: 0 10px 30px rgba(0,0,0,0.06);
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 24px;
    }
    
    [data-theme="dark"] {
      --bg-body: #0b0f19;
      --bg-container: #151b26;
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      --primary: #00ffaa;
      --primary-hover: #00cc88;
      --primary-light: rgba(0, 255, 170, 0.1);
      --border-color: #1e293b;
      --marquee-bg: rgba(0, 255, 170, 0.1);
      --marquee-text: #00ffaa;
      --sidebar-bg: rgba(21, 27, 38, 0.7);
      --shadow-sm: 0 4px 20px rgba(0,0,0,0.2);
      --shadow-md: 0 10px 40px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-main); transition: background-color 0.4s ease, color 0.4s ease; }
    
    .app-wrapper { display: flex; min-height: 100vh; flex-direction: column; }
    .banner { background-color: var(--marquee-bg); color: var(--marquee-text); padding: 10px 0; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; }
    
    .topbar { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 30px; background-color: var(--bg-container); box-shadow: var(--shadow-sm); z-index: 10; position: relative; text-align: center; }
    
    .logo-container { animation: bounceOnly 2s infinite ease-in-out; }
    .logo { font-weight: 700; font-size: 1.4rem; color: var(--primary); letter-spacing: -0.2px; line-height: 1.2; }
    .sublogo { font-size: 0.95rem; font-weight: 600; color: var(--text-muted); margin-top: 4px; }

    @keyframes bounceOnly {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    
    .theme-toggle-wrapper { position: absolute; right: 20px; top: 15px; }
    .theme-toggle { background: var(--primary-light); border: none; color: var(--text-main); padding: 4px 10px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.75rem; transition: all 0.3s ease; white-space: nowrap; }
    .theme-toggle:hover { background: var(--primary); color: #fff; transform: translateY(-1px); }
    
    .main-content { display: flex; flex: 1; overflow: hidden; }
    
    .sidebar { width: 260px; background-color: var(--sidebar-bg); padding: 25px 15px; display: flex; flex-direction: column; justify-content: space-between; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 2px 0 15px rgba(0,0,0,0.02); z-index: 5; }
    .sidebar-menu { display: flex; flex-direction: column; flex: 1; }
    .nav-item { padding: 12px 20px; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; color: var(--text-main); font-weight: 500; font-size: 0.95rem; border-radius: var(--radius-sm); transition: all 0.3s ease; }
    .nav-item:hover { color: var(--primary); transform: translateX(5px); }
    .nav-item.active { background-color: var(--primary-light); color: var(--primary); font-weight: 600; }
    
    .watermark-donie { font-size: 0.75rem; font-style: italic; color: var(--text-muted); padding: 10px 15px; text-align: left; opacity: 0.7; }

    .content-area { flex: 1; padding: 35px; overflow-y: auto; }
    .page-section { display: none; background: var(--bg-container); padding: 35px; border-radius: var(--radius-md); box-shadow: var(--shadow-md); border: 1px solid var(--border-color); }
    .page-section.active { display: block; animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes slideUpFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    h2 { margin-bottom: 25px; color: var(--text-main); font-weight: 700; font-size: 1.5rem; }
    h2::after { content: ''; display: block; width: 50px; height: 4px; background: var(--primary); margin-top: 10px; border-radius: 10px; }
    
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.9rem; color: var(--text-main); }
    
    input, select, textarea { width: 100%; padding: 14px 18px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); background-color: var(--bg-body); color: var(--text-main); outline: none; font-size: 0.95rem; transition: all 0.3s ease; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); background-color: var(--bg-container); box-shadow: 0 0 0 4px var(--primary-light); }
    input:disabled, input[readonly] { opacity: 0.7; cursor: not-allowed; }
    
    .uppercase-input { text-transform: uppercase; }
    
    .btn { background-color: var(--primary); color: #fff; border: none; padding: 12px 24px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 0.95rem; letter-spacing: 0.5px; transition: all 0.3s ease; box-shadow: 0 4px 12px var(--primary-light); }
    .btn:hover { background-color: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 15px var(--primary-light); }
    
    .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 25px; margin-bottom: 10px; }
    .card { background: var(--bg-container); padding: 25px; border-radius: var(--radius-md); border: 1px solid var(--border-color); text-align: center; box-shadow: var(--shadow-sm); transition: transform 0.3s ease; }
    .card:hover { transform: translateY(-5px); }
    .card div { color: var(--text-main); font-size: 0.95rem; font-weight: 500; }
    .card h3 { font-size: 2.5rem; color: var(--primary); margin: 10px 0 0 0; font-weight: 700; }
    
    #toast-container { position: fixed; top: 25px; right: 25px; z-index: 9999; }
    .toast { min-width: 280px; padding: 16px 24px; border-radius: var(--radius-sm); margin-bottom: 12px; color: white; font-weight: 500; font-size: 0.95rem; box-shadow: 0 10px 25px rgba(0,0,0,0.15); transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .toast.show { transform: translateX(0); }
    .toast.success { background-color: #10B981; }
    .toast.error { background-color: #EF4444; }
    
    .form-divider { font-size: 1rem; color: var(--primary); font-weight: 600; margin: 25px 0 15px 0; border-bottom: 1px dashed var(--border-color); padding-bottom: 8px; }

    @media (max-width: 768px) {
      .main-content { flex-direction: column; }
      .sidebar { width: 100%; padding: 15px; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
      .sidebar-menu { flex-direction: row; overflow-x: auto; width: 100%; }
      .nav-item { white-space: nowrap; margin-bottom: 0; margin-right: 10px; }
      .content-area { padding: 20px; }
      .page-section { padding: 25px 20px; }
      .topbar { padding: 15px; text-align: center; }
      .theme-toggle-wrapper { position: static; margin-top: 10px; }
    }
  </style>
</head>
<body data-theme="light">

  <div class="app-wrapper">
    <!-- Marquee Banner -->
    <div class="banner">
      <marquee id="marquee-text">Menghubungkan ke server Google Sheet Kemenag Musi Rawas...</marquee>
    </div>

    <!-- Header -->
    <header class="topbar">
      <div class="logo-container">
        <div class="logo">Seksi Pendidikan Madrasah</div>
        <div class="sublogo">Kantor Kementerian Agama Kabupaten Musi Rawas</div>
      </div>
      <div class="theme-toggle-wrapper">
        <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark</button>
      </div>
    </header>

    <div class="main-content">
      <!-- Sidebar Navigation -->
      <nav class="sidebar">
        <div class="sidebar-menu">
          <div class="nav-item active" onclick="navigate('dashboard', this)">📊 Dashboard</div>
          <div class="nav-item" onclick="navigate('input-kelembagaan', this)">🏫 Input Kelembagaan</div>
        </div>
        <div class="watermark-donie">@doniepenmadmura</div>
      </nav>

      <!-- Content Area -->
      <main class="content-area">
        
        <!-- SECTION: DASHBOARD -->
        <section id="dashboard" class="page-section active">
          <h2>Dashboard Statistik</h2>
          <div class="grid-cards" style="margin-bottom: 25px;">
            <div class="card">
              <div>Total Lembaga</div>
              <h3 id="dash-total">-</h3>
            </div>
            <div class="card">
              <div>Telah Submit</div>
              <h3 id="dash-submit">-</h3>
            </div>
          </div>
        </section>

        <!-- SECTION: INPUT KELEMBAGAAN -->
        <section id="input-kelembagaan" class="page-section">
          <h2>Form Kelembagaan</h2>
          <form id="form-kelembagaan" onsubmit="event.preventDefault(); submitKelembagaan();">
            
            <div class="form-divider">1. Identitas Utama</div>
            <div class="grid-cards">
              <div class="form-group">
                <label>Jenjang</label>
                <select id="k-jenjang" required>
                  <option value="">Pilih Jenjang</option>
                  <option value="RA">RA</option>
                  <option value="MI">MI</option>
                  <option value="MTs">MTs</option>
                  <option value="MA">MA</option>
                </select>
              </div>
              <div class="form-group">
                <label>Status Kelembagaan</label>
                <select id="k-status" required>
                  <option value="">Pilih Status</option>
                  <option value="NEGERI">NEGERI</option>
                  <option value="SWASTA">SWASTA</option>
                </select>
              </div>
            </div>

            <div class="grid-cards">
              <div class="form-group" style="grid-column: 1 / -1;">
                <label>Nama Lembaga</label>
                <input type="text" id="k-nama" class="uppercase-input" required placeholder="CONTOH: MIS ZETTBOS">
              </div>
              <div class="form-group">
                <label>NSM</label>
                <input type="number" id="k-nsm" required placeholder="Masukkan NSM">
              </div>
              <div class="form-group">
                <label>NPSN</label>
                <input type="number" id="k-npsn" required placeholder="Masukkan NPSN">
              </div>
            </div>

            <div class="form-divider">2. Alamat & Kontak</div>
            <div class="grid-cards">
              <div class="form-group">
                <label>Desa / Kelurahan</label>
                <input type="text" id="k-desa" class="uppercase-input" required>
              </div>
              <div class="form-group">
                <label>Kecamatan</label>
                <input type="text" id="k-kecamatan" class="uppercase-input" required>
              </div>
              <div class="form-group">
                <label>Nomor WhatsApp Kepala</label>
                <input type="text" id="k-wa-kepala" required placeholder="081234567890" maxlength="13">
              </div>
            </div>

            <button type="submit" class="btn" id="btn-submit-lbg" style="width: 100%; font-size: 1.1rem; padding: 15px; margin-top: 20px;">Simpan Data Kelembagaan</button>
          </form>
        </section>

      </main>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <script>
    // ⚠️ GANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA YANG BERAKHIRAN /exec
    var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycb.../exec";

    window.onload = function() {
      fetchInitialData();
    };

    function toggleTheme() {
      var body = document.body;
      var btn = document.querySelector('.theme-toggle');
      if (body.getAttribute('data-theme') === 'light') {
        body.setAttribute('data-theme', 'dark');
        btn.innerHTML = '☀️ Light';
      } else {
        body.setAttribute('data-theme', 'light');
        btn.innerHTML = '🌙 Dark';
      }
    }

    function navigate(sectionId, navElement) {
      var items = document.querySelectorAll('.nav-item');
      var sections = document.querySelectorAll('.page-section');
      for(var i=0; i<items.length; i++) { items[i].classList.remove('active'); }
      for(var j=0; j<sections.length; j++) { sections[j].classList.remove('active'); }
      if(navElement) navElement.classList.add('active');
      document.getElementById(sectionId).classList.add('active');
    }

    function showToast(message, type) {
      var container = document.getElementById('toast-container');
      var toast = document.createElement('div');
      toast.className = 'toast ' + type;
      toast.innerText = message;
      container.appendChild(toast);
      setTimeout(function() { toast.classList.add('show'); }, 10);
      setTimeout(function() {
        toast.classList.remove('show');
        setTimeout(function() { toast.remove(); }, 400);
      }, 4000);
    }

    function fetchInitialData() {
      fetch(APPS_SCRIPT_URL + "?action=getInitialData")
        .then(function(res) { return res.json(); })
        .then(function(res) {
          if(res.status === 'success') {
            document.getElementById('marquee-text').innerText = res.banner;
            document.getElementById('dash-total').innerText = res.stats.total;
            document.getElementById('dash-submit').innerText = res.stats.submitted;
          }
        })
        .catch(function(err) {
          showToast("Gagal memuat data dari Google Sheet", "error");
        });
    }

    function submitKelembagaan() {
      var btn = document.getElementById('btn-submit-lbg');
      btn.innerText = "Menyimpan ke Google Sheet...";
      btn.disabled = true;

      var formData = {
        action: "saveKelembagaan",
        jenjang: document.getElementById('k-jenjang').value,
        statusLembaga: document.getElementById('k-status').value,
        nama: document.getElementById('k-nama').value,
        nsm: document.getElementById('k-nsm').value,
        npsn: document.getElementById('k-npsn').value,
        desa: document.getElementById('k-desa').value,
        kecamatan: document.getElementById('k-kecamatan').value,
        waKepala: document.getElementById('k-wa-kepala').value
      };

      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(formData)
      })
      .then(function() {
        btn.innerText = "Simpan Data Kelembagaan";
        btn.disabled = false;
        showToast("Data berhasil disimpan ke Google Sheet!", "success");
        document.getElementById('form-kelembagaan').reset();
        setTimeout(fetchInitialData, 1500);
      })
      .catch(function(err) {
        btn.innerText = "Simpan Data Kelembagaan";
        btn.disabled = false;
        showToast("Gagal menyimpan data", "error");
      });
    }
  </script>
</body>
</html>
